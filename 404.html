<!DOCTYPE html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Страница не найдена</title><meta name='robots' content='noindex'><style>:root{
--bg:#070c11;--txt:#eaeff6;--muted:#8e9bab;
--acc:#38d0e8;--acc-d:#1f9fb5;--acc2:#7ee081;
--acc-lt:#73deee;--acc-rgb:56,208,232;
--btn-txt:#04171c;
--glass:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.022));
--glass-br:rgba(255,255,255,.10);
--glass-hi:inset 0 1px 0 rgba(255,255,255,.13);
--shadow:0 10px 34px rgba(0,0,0,.42);
--r:14px}
body::before{background:
 radial-gradient(58% 46% at 12% -4%,rgba(56,208,232,.20),transparent 62%),
 radial-gradient(48% 38% at 88% 6%,rgba(38,120,220,.14),transparent 62%),
 radial-gradient(56% 44% at 72% 96%,rgba(126,224,129,.10),transparent 62%),
 radial-gradient(50% 40% at 20% 88%,rgba(90,80,220,.09),transparent 62%)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
-webkit-font-smoothing:antialiased;overflow-x:hidden;
overflow-wrap:break-word}
img{max-width:100%;height:auto}
li.ci>*{min-width:0}
.info,.bonus,.act{min-width:0}
h1,h2,h3{overflow-wrap:break-word}
/* Световые пятна фона — фиксированы, поэтому не пересчитываются при скролле */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
opacity:.5;background-image:
 radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
background-size:44px 44px}
a{transition:all .15s ease}
/* Три колонки: бренд слева, предупреждение строго по центру страницы */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
gap:1rem;max-width:900px;margin:0 auto;padding:.5rem 1rem;
font-size:.8rem;color:var(--muted)}
.tb-brand{font-weight:800;color:var(--acc);letter-spacing:-.01em;
font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar::after{content:''}
.tb-age{grid-column:2;text-align:center}
.tb-age b{color:#c3cede;font-weight:700}
@media(max-width:560px){.tb-full{display:none}}
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;
background:transparent}
#pbar{display:block;height:100%;width:0;
background:linear-gradient(90deg,var(--acc-d),var(--acc));transition:width .1s}
.totop{position:fixed;right:1.1rem;bottom:1.3rem;z-index:50;width:46px;
height:46px;border-radius:50%;border:1px solid var(--glass-br);
background:var(--glass);color:var(--acc);font-size:1.2rem;cursor:pointer;
opacity:0;pointer-events:none;transform:translateY(10px);
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
transition:opacity .25s,transform .25s,background .2s,color .2s;
box-shadow:var(--shadow),var(--glass-hi)}
.totop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.totop:hover{background:linear-gradient(180deg,var(--acc-lt),var(--acc-d));
color:var(--btn-txt);border-color:transparent;
box-shadow:0 8px 26px rgba(var(--acc-rgb),.4)}
.toc{background:var(--glass);border:1px solid var(--glass-br);
border-radius:var(--r);padding:1.1rem 1.3rem;margin:2rem 0;
box-shadow:var(--shadow),var(--glass-hi)}
.toc h2{margin:0 0 .6rem;font-size:1rem;border:0;padding:0;
text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.toc ol{margin:0;padding-left:1.2rem;columns:2;column-gap:2rem}
.toc li{margin:.35rem 0;break-inside:avoid}
.toc a{color:var(--txt);text-decoration:none;font-size:.9rem}
.toc a:hover{color:var(--acc);text-decoration:underline}
ol.clist{list-style:none;margin:1.2rem 0;padding:0;display:grid;gap:.7rem}
li.ci{position:relative;display:grid;
grid-template-columns:2.2rem 64px 1fr auto auto;align-items:center;
gap:1rem;background:var(--glass);border:1px solid var(--glass-br);
border-radius:var(--r);padding:1.05rem 1.15rem;overflow:hidden;
box-shadow:var(--shadow),var(--glass-hi);
transition:transform .22s cubic-bezier(.2,.7,.3,1),
 border-color .22s,box-shadow .22s}
/* Диагональный блик — имитация преломления света в стекле */
li.ci::after{content:'';position:absolute;inset:0;pointer-events:none;
background:linear-gradient(105deg,transparent 38%,
 rgba(255,255,255,.055) 47%,transparent 56%)}
li.ci:hover{transform:translateY(-3px);
border-color:rgba(255,255,255,.19);
box-shadow:0 16px 44px rgba(0,0,0,.5),var(--glass-hi)}
li.ci.feat{border-color:rgba(var(--acc-rgb),.42);
background:linear-gradient(140deg,rgba(var(--acc-rgb),.14),
 rgba(255,255,255,.03) 55%);
box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 0 1px rgba(var(--acc-rgb),.10),
 0 0 34px rgba(var(--acc-rgb),.13),var(--glass-hi)}
li.ci.feat:hover{box-shadow:0 18px 52px rgba(0,0,0,.52),
 0 0 44px rgba(var(--acc-rgb),.22),var(--glass-hi)}
li.ci .rank{background:rgba(255,255,255,.07);color:var(--acc);font-weight:800;
border-radius:11px;width:34px;height:34px;display:grid;place-items:center;
font-size:1rem;border:1px solid var(--glass-br);
box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
li.ci.feat .rank{background:linear-gradient(180deg,var(--acc),var(--acc-d));
color:var(--btn-txt);border-color:rgba(var(--acc-rgb),.5);
box-shadow:0 3px 14px rgba(var(--acc-rgb),.4)}
li.ci .logo img{border-radius:13px;object-fit:contain;
background:rgba(255,255,255,.05);display:block;
border:1px solid var(--glass-br);
box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.32)}
li.ci .info h3{margin:0;font-size:1.05rem}
li.ci .meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:.3rem}
li.ci .meta .m{font-size:.8rem;color:var(--txt)}
li.ci .meta i{color:var(--muted);font-style:normal;margin-right:.3rem}
li.ci .bonus{text-align:right;min-width:120px}
li.ci .bonus i{display:block;font-style:normal;font-size:.72rem;
color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
li.ci .bonus b{color:var(--acc2);font-size:.95rem}
li.ci .bonus.muted{color:var(--muted);font-size:.85rem}
li.ci .act{min-width:120px}
li.ci .promo{font-size:.72rem;color:var(--muted);margin:.4rem 0 0;
text-align:center}
main{max-width:900px;margin:0 auto;padding:0 1rem 3rem}
h1{font-size:clamp(1.65rem,4.2vw,2.45rem);line-height:1.2;margin:.6rem 0 1rem;
letter-spacing:-.02em;
background:linear-gradient(180deg,#fff,#b9c6d6);-webkit-background-clip:text;
background-clip:text;color:transparent}
h2{font-size:clamp(1.22rem,2.6vw,1.55rem);margin:2.6rem 0 .8rem;
padding-bottom:.5rem;letter-spacing:-.01em;
border-bottom:1px solid var(--glass-br)}
.lead{font-size:1.06rem;color:#c4cfdc}
.updated{color:var(--muted);font-size:.85rem}
.block{margin-top:1rem}
.hint,.disclaimer{color:var(--muted);font-size:.88rem;
background:var(--glass);border-left:3px solid var(--acc);
padding:.8rem 1rem;border-radius:0 12px 12px 0;box-shadow:var(--glass-hi)}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;
    scroll-behavior:auto!important}
  .btn::after{display:none}
}
details{background:var(--glass);border:1px solid var(--glass-br);
border-radius:13px;padding:.85rem 1.05rem;margin:.6rem 0;
box-shadow:var(--glass-hi);transition:border-color .2s,background .2s}
details:hover{border-color:rgba(255,255,255,.17)}
details[open]{background:linear-gradient(150deg,rgba(255,255,255,.09),
 rgba(255,255,255,.03))}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';float:right;color:var(--acc);font-weight:700;
font-size:1.15rem;line-height:1;transition:transform .2s}
details[open] summary::before{content:'−'}
.faq-item p{color:#cdd6e0;margin:.7rem 0 .2rem}
footer{border-top:1px solid var(--glass-br);
background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);
padding:2rem 1rem;color:var(--muted);font-size:.85rem;margin-top:3rem}
footer p{max-width:900px;margin:.6rem auto}
.legal{color:#7d8794;font-style:italic}
code{background:#0c0f13;padding:.1rem .35rem;border-radius:4px;font-size:.85em}
.badge{display:inline-block;vertical-align:middle;margin-left:.6rem;
background:rgba(255,255,255,.08);color:var(--muted);font-size:.62rem;
font-weight:700;letter-spacing:.07em;text-transform:uppercase;
padding:.22rem .6rem;border-radius:20px;border:1px solid var(--glass-br);
white-space:nowrap;position:relative;top:-1px}
.logo-ph{width:64px;height:64px;border-radius:13px;
background:rgba(255,255,255,.05);display:grid;place-items:center;
font-weight:800;color:var(--acc);border:1px solid var(--glass-br)}
.badge.b1{background:linear-gradient(135deg,var(--acc-lt),var(--acc-d));
color:var(--btn-txt);border-color:transparent;
box-shadow:0 3px 12px rgba(var(--acc-rgb),.35)}
.btn{position:relative;display:block;text-align:center;overflow:hidden;
background:linear-gradient(180deg,var(--acc-lt),var(--acc) 45%,var(--acc-d));
color:var(--btn-txt);font-weight:700;padding:.78rem 1.1rem;border-radius:12px;
text-decoration:none;margin-top:auto;border:1px solid rgba(255,255,255,.22);
box-shadow:0 6px 20px rgba(var(--acc-rgb),.26),
 inset 0 1px 0 rgba(255,255,255,.45);
transition:transform .2s,box-shadow .2s,filter .2s}
.btn::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
transition:left .55s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
box-shadow:0 10px 28px rgba(var(--acc-rgb),.4),
 inset 0 1px 0 rgba(255,255,255,.5)}
.btn:hover::after{left:130%}
.btn:active{transform:translateY(0)}
.btn-off{background:rgba(255,255,255,.06);color:var(--muted);font-weight:500;
font-size:.85rem;box-shadow:none;border-color:var(--glass-br)}
.btn-off::after{display:none}
.article h2{margin-top:2.5rem}
.article h3{margin:1.6rem 0 .5rem;font-size:1.08rem;color:#dce3ea}
.article ul{padding-left:1.2rem}
.article li{margin:.35rem 0}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;
background:linear-gradient(0deg,rgba(8,10,15,.92),rgba(255,255,255,.05));
-webkit-backdrop-filter:blur(24px) saturate(170%);
backdrop-filter:blur(24px) saturate(170%);
border-top:1px solid var(--glass-br);padding:.65rem .8rem;
align-items:center;gap:.7rem;
box-shadow:0 -8px 30px rgba(0,0,0,.5),var(--glass-hi)}
.sticky img{border-radius:7px;object-fit:contain;background:#0a0d11;
flex-shrink:0}
.sticky .sn{font-weight:600;font-size:.88rem;line-height:1.2}
.sticky .sb{color:var(--acc2);font-size:.78rem;font-weight:600}
.sticky .btn{margin:0;padding:.6rem 1.1rem;font-size:.88rem;white-space:nowrap}
.cp{color:#6b7684;font-size:.8rem}
/* Планшет: кнопка остаётся в первой строке, бонус уходит под название */
@media(max-width:880px){
  li.ci{grid-template-columns:2.2rem 56px 1fr auto;
    grid-template-areas:"r l i a" ". . b b";gap:.5rem 1rem;
    align-items:center}
  li.ci .rank{grid-area:r}
  li.ci .logo{grid-area:l}
  li.ci .logo img{width:56px;height:56px}
  li.ci .info{grid-area:i}
  li.ci .bonus{grid-area:b;text-align:left;min-width:0}
  li.ci .bonus i{display:inline;margin-right:.4rem}
  li.ci .act{grid-area:a;min-width:0}
}
/* Узкий планшет и телефон: всё в столбик */
@media(max-width:640px){
  li.ci{grid-template-columns:2rem 48px 1fr;
    grid-template-areas:"r l i" "b b b" "a a a";gap:.5rem .7rem;
    padding:.9rem}
  li.ci .rank{width:28px;height:28px;font-size:.9rem}
  li.ci .logo img{width:48px;height:48px}
  li.ci .bonus{margin-top:.5rem}
  li.ci .bonus b{font-size:1rem}
  li.ci .act .btn{padding:.7rem}
  .toc ol{columns:1}
  .sticky{display:flex}
  body{padding-bottom:4.6rem}
  .totop{bottom:5.2rem;right:.7rem;width:40px;height:40px}
  h1{font-size:1.5rem}
  main{padding:0 .8rem 2rem}
  .toc{padding:.9rem 1rem}
}
/* Малые экраны 320-380px */
@media(max-width:380px){
  li.ci{grid-template-columns:1.8rem 40px 1fr;gap:.4rem .6rem;padding:.8rem}
  li.ci .logo img{width:40px;height:40px}
  li.ci .info h3{font-size:.95rem}
  li.ci .meta{gap:.2rem .6rem}
  li.ci .meta .m{font-size:.75rem}
  .tb-brand{font-size:.85rem}
  .topbar{padding:.45rem .8rem;font-size:.75rem}
  h1{font-size:1.32rem}
  .lead{font-size:.95rem}
  .sticky{padding:.5rem .6rem;gap:.5rem}
  .sticky .btn{padding:.55rem .8rem;font-size:.82rem}
}
</style></head><body><main style='text-align:center;padding:5rem 1rem'><h1>404</h1><p class='lead'>Такой страницы нет.</p><p><a class='btn' style='display:inline-block;max-width:260px;margin:1rem auto' href='./'>На главную</a></p></main></body></html>
